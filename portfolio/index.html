<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mu's Portfolio</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <h1 class="site-title">Mu's Portfolio</h1>
    </header>

    <main class="site-main">
      <section class="section" id="apps" aria-labelledby="apps-heading">
        <h2 id="apps-heading">各アプリへのリンク</h2>
        <ul class="app-links">
          <li>
            <a class="app-link" href="/app1/">App 1</a>
          </li>
          <li>
            <a class="app-link placeholder" href="#" aria-disabled="true">App 2（準備中）</a>
          </li>
          <li>
            <a class="app-link placeholder" href="#" aria-disabled="true">App 3（準備中）</a>
          </li>
        </ul>
      </section>

      <section class="section" id="stack" aria-labelledby="stack-heading">
        <h2 id="stack-heading">使用技術スタック</h2>
        <p>Not yet</p>
      </section>

      <section class="section" id="infra" aria-labelledby="infra-heading">
        <h2 id="infra-heading">インフラ構成図</h2>
        <div class="infra-placeholder" role="img" aria-label="インフラ構成図の挿入予定エリア">
          <!-- 後から images/ 内の図を挿入する -->
        </div>
      </section>

      <section class="section" id="about" aria-labelledby="about-heading">
        <h2 id="about-heading">自己紹介</h2>
        <div class="content-placeholder" aria-label="自己紹介の記載予定エリア"></div>
      </section>

      <section class="section" id="contact" aria-labelledby="contact-heading">
        <h2 id="contact-heading">連絡先</h2>
        <div class="content-placeholder" aria-label="連絡先の記載予定エリア"></div>
      </section>
    </main>
  </body>
</html>
