<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mamimuMemo</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="page-header">
      <a class="back-link" href="/">ポートフォリオサイトに戻る</a>
      <h1 class="page-title">mamimuMemo</h1>
    </header>

    <main class="page-main">
      <form class="memo-form" action="#" method="post">
        <table class="memo-table">
          <tbody>
            <tr>
              <td>
                <label class="visually-hidden" for="heading-1">見出し</label>
                <input
                  class="memo-heading"
                  id="heading-1"
                  name="heading[]"
                  type="text"
                  placeholder="見出し"
                  autocomplete="off"
                />
                <label class="visually-hidden" for="content-1">メモの内容</label>
                <textarea
                  class="memo-content"
                  id="content-1"
                  name="content[]"
                  rows="4"
                  placeholder="メモの内容"
                ></textarea>
              </td>
            </tr>
            <tr>
              <td>
                <label class="visually-hidden" for="heading-2">見出し</label>
                <input
                  class="memo-heading"
                  id="heading-2"
                  name="heading[]"
                  type="text"
                  placeholder="見出し"
                  autocomplete="off"
                />
                <label class="visually-hidden" for="content-2">メモの内容</label>
                <textarea
                  class="memo-content"
                  id="content-2"
                  name="content[]"
                  rows="4"
                  placeholder="メモの内容"
                ></textarea>
              </td>
            </tr>
            <tr>
              <td>
                <label class="visually-hidden" for="heading-3">見出し</label>
                <input
                  class="memo-heading"
                  id="heading-3"
                  name="heading[]"
                  type="text"
                  placeholder="見出し"
                  autocomplete="off"
                />
                <label class="visually-hidden" for="content-3">メモの内容</label>
                <textarea
                  class="memo-content"
                  id="content-3"
                  name="content[]"
                  rows="4"
                  placeholder="メモの内容"
                ></textarea>
              </td>
            </tr>
          </tbody>
        </table>
      </form>
    </main>
  </body>
</html>
